<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>김태균의 웹 POS 포트폴리오</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; background-color: #f4f6f9; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #result-box { margin-top: 20px; padding: 15px; background: #282c34; color: #abb2bf; border-radius: 6px; text-align: left; font-family: monospace; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏪 김태균의 가상 웹 POS 시스템</h2>
    <p>아래 버튼을 누르면 백엔드 서버를 거쳐 실제 NICE 결제 서버와 실시간 통신합니다.</p>
    <br>
    <button onclick="sendPayment()">💳 가상 결제 요청</button>

    <div id="result-box">
        <b style="color: #61afef;">[콘솔 출력 결과]</b>
        <pre id="log-content"></pre>
    </div>
</div>

<script>
    function sendPayment() {
        const resultBox = document.getElementById('result-box');
        const logContent = document.getElementById('log-content');

        logContent.textContent = "NICE 서버로 결제 요청 중...";
        resultBox.style.display = "block";

        // 내 스프링 부트 백엔드 API 주소를 호출합니다.
        fetch('/api/pay', { method: 'POST' })
            .then(res => res.text())
            .then(data => {
                logContent.textContent = data;
            })
            .catch(err => {
                logContent.textContent = "에러 발생: " + err;
            });
    }
</script>

</body>
</html>
